<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .grow {
        flex: 1;
      }
      .status {
        font-size: 13px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9e9e9e;
      }
      .dot.on {
        background: #2e7d32;
      }
      /* toggle switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 24px;
        transition: 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: #0b57d0;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      label.lbl {
        font-size: 13px;
        font-weight: 600;
      }
      .cfg label {
        font-size: 12px;
        color: #555;
        display: block;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .btns {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 7px;
        font-size: 13px;
        border: none;
        border-radius: 4px;
        background: #0b57d0;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #eee;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Browser MCP Bridge</h1>

    <div class="row">
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
      <span class="lbl grow" id="toggleLabel">Enabled</span>
    </div>

    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="status grow" id="statusText">Checking…</span>
    </div>

    <div class="cfg">
      <label for="url">Bridge WebSocket URL</label>
      <input id="url" type="text" placeholder="ws://127.0.0.1:9010" />
      <div class="btns">
        <button id="save">Save &amp; Connect</button>
        <button id="reconnect" class="secondary">Reconnect</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
