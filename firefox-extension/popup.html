<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9e9e9e;
      }
      .dot.on {
        background: #2e7d32;
      }
      label {
        font-size: 12px;
        color: #555;
        display: block;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 7px;
        font-size: 13px;
        border: none;
        border-radius: 4px;
        background: #0b57d0;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #eee;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Browser MCP Bridge</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking…</span>
    </div>
    <label for="url">Bridge WebSocket URL</label>
    <input id="url" type="text" placeholder="ws://127.0.0.1:9010" />
    <div class="row">
      <button id="save">Save &amp; Connect</button>
      <button id="reconnect" class="secondary">Reconnect</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
